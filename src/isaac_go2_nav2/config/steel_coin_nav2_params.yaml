# steel_coin_nav2_params.yaml — 基于 robot-dog-console nav2_params.yaml（生产验证版）
# AMCL + DWB 控制器（RK3588 带不动 MPPI），odom=/odom_nav，robot_base_frame=base_footprint
# Nav2 parameters for AgiBot D1 dog + FAST-LIO2 (indoor 15m2)
# Loaded via: ros2 launch nav2_dog nav2_bringup.launch.py

amcl:
  ros__parameters:
    use_sim_time: False
    # 启动即发布 map→odom，避免 planner_server 在 Activating 里死等 TF（无初值时会卡数分钟，
    # lifecycle 带不起 bt_navigator / velocity_smoother，表现为“导航一点就停/取消”）。
    # 网页「重定位」/ 设初始位姿会覆盖这个粗值。
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    # 里程计 = FAST-LIO /odom_nav（非狗本体里程计）。0.05 太信里程计：FAST-LIO 在窄走廊打滑时
    # 粒子跟着滑、激光拉不回来（2026-10-01 实测走丢撞墙）→ 0.15，让激光能纠正。
    alpha1: 0.15
    alpha2: 0.15
    alpha3: 0.15
    alpha4: 0.15
    alpha5: 0.10
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 8.0
    laser_min_range: 0.2
    laser_model_type: "likelihood_field"
    max_beams: 360
    max_particles: 1500
    min_particles: 400
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    # 随机注入粒子会让箭头突然跳；丢定位请点「重定位」
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 2
    robot_model_type: "nav2_amcl::OmniMotionModel"
    save_pose_rate: 0.5
    # 2026-10-02：0.22→0.10、beams 180→360、update 0.10/0.15→0.05/0.08。门口实测激光-墙线平均距离
    # 15.6→6.0 cm，残余偏差 11 cm/6°→3.5 cm/0°（scripts/diag/scan_map_align.py）。偏 6° 会让进门转弯冲过头贴门框
    sigma_hit: 0.10
    tf_broadcast: true
    transform_tolerance: 1.0
    # 不太勤：过勤会跟噪声激光来回拽
    update_min_a: 0.08
    update_min_d: 0.05
    z_hit: 0.75
    z_max: 0.05
    z_rand: 0.18
    z_short: 0.05
    scan_topic: /scan
    odom_topic: /odom_nav

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom_nav
    bt_loop_duration: 20
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    # 去掉 BackUp 恢复的行为树：雷达低头装、正后方是盲区，禁止任何倒车（2026-10-01）
    default_nav_to_pose_bt_xml: "/home/linaro/steel_coin_nav_ws/src/isaac_go2_nav2/behavior_trees/navigate_to_pose_no_backup.xml"
    default_nav_through_poses_bt_xml: "/home/linaro/steel_coin_nav_ws/src/isaac_go2_nav2/behavior_trees/navigate_through_poses_no_backup.xml"
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

navfn_planner:
  ros__parameters:
    tolerance: 0.25
    use_astar: true
    allow_unknown: true

# MPPI 参数必须挂在 controller_server.FollowPath 下；单独的 mppi_controller: 块不会生效。
# RK3588 上 MPPI batch=1200 会拖垮 BT（tick rate exceeded），改用更轻的 DWB + 全向。
controller_server:
  ros__parameters:
    controller_frequency: 10.0
    min_acceptable_robot_speed: 0.01
    odom_topic: "/odom_nav"
    controller_plugins: ["FollowPath"]
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.08
      movement_time_allowance: 30.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 0.22
      stateful: true
    FollowPath:
      # 2026-10-01：DWB(+RotationShim) → RPP。全局路径本身很好，但 DWB 采样打分 + 全向侧移
      # 会在路径附近转来转去、过门左右摆；RPP 只追路径前方 lookahead 点，偏 >45° 先原地转正，
      # 只前进不倒车、不侧移。旧 DWB 块备份在 ~/fix_backup_v3/FollowPath_dwb_shim_block.yaml
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.22
      # 试过 0.30（想绕人时少切内角）：狗转向响应慢，进门 90° 弯转晚冲过头、贴门框卡死 → 回 0.45（2026-10-02）
      lookahead_dist: 0.45
      min_lookahead_dist: 0.30
      max_lookahead_dist: 0.70
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false
      rotate_to_heading_angular_vel: 0.45
      use_rotate_to_heading: true
      # 0.785→0.52：偏 >30° 先原地转正再走，进门 90° 弯不再甩出去（2026-10-02）
      rotate_to_heading_min_angle: 0.52
      max_angular_accel: 1.2
      allow_reversing: false
      transform_tolerance: 1.0
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.5
      use_collision_detection: true
      # 「大胆沿全局路线走」（用户 2026-10-02 明确要求、自担风险）：0.1 s < 一格(0.05 m)/速度，
      # RPP 不再往前预判，只在机身轮廓已经压到致命格时才停（接触才停）。全局路线已含实时障碍层、会绕人。
      # 想恢复「提前约 10 cm 停」：改回 0.6（可在线 ros2 param set）。
      max_allowed_time_to_collision_up_to_carrot: 0.1
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9   # 0.6→0.9：弯道早点减速、贴线（2026-10-02）
      regulated_linear_scaling_min_speed: 0.08
      # 靠近障碍自动减速：2026-10-02 试过（dist 0.45 / gain 0.5）反而更糟——Humble RPP 碰撞预测步长
      # = 栅格 0.05 m / 速度，0.08 m/s 时一步 0.63 s > max_allowed_time 0.6 s → 根本不往前预测，
      # 只查当前位置，狗慢慢蹭到真碰上人的格子 → 原地卡死、导航失败。别再开，除非同时加大 max_allowed_time。
      use_cost_regulated_linear_velocity_scaling: false
      max_robot_pose_search_dist: 10.0
      use_interpolation: true

planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.25
      use_astar: true
      allow_unknown: true
    expected_planner_frequency: 1.0

smoother_server:
  ros__parameters:
    smoothing_frequency: 20.0
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"

# Humble 节点名是 behavior_server（旧 recoveries_server 名会导致参数全失效，
# 默认 robot_base_frame=base_link → 与本栈 odom→base_footprint 断树，backup/spin 全挂）
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "wait"]   # 不加载 backup：禁止倒车
    spin:
      plugin: "nav2_behaviors/Spin"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 1.0
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.6
    min_rotational_vel: 0.2
    rotational_acc_lim: 2.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: "odom"
      robot_base_frame: "base_footprint"
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      transform_tolerance: 1.0
      footprint: "[[0.325, 0.19], [-0.325, 0.19], [-0.325, -0.19], [0.325, -0.19]]"   # D1 实测 0.635×0.36 m +1~2 cm（Nav2 默认再 padding 0.01）。0.66×0.40 时人旁 0.8 m 缝过不去（2026-10-02）
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: "livox"
        livox:
          topic: "/scan"
          data_type: "LaserScan"
          expected_update_rate: 1.0
          # /scan 是 base_footprint 平面激光（z=0，stage2 已按 0.05~0.85 m 高度带筛过）。
          # 原 min 0.10 把所有激光点滤掉 → 局部代价地图全空、DWB 看不到墙 → 走廊撞墙（2026-10-01）
          min_obstacle_height: -0.10
          max_obstacle_height: 0.50
          obstacle_max_range: 6.0
          raytrace_max_range: 6.5
          clearing: true
          marking: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.45
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: "map"
      robot_base_frame: "base_footprint"
      resolution: 0.05
      footprint: "[[0.325, 0.13], [-0.325, 0.13], [-0.325, -0.13], [0.325, -0.13]]"   # 只给全局规划用的「瘦」轮廓：半宽 0.19→0.13（2026-10-02）。人旁 0.8 m 缝时内切半径 0.2 把可通行带压到 ~0.4 m，人身上激光一晃就「堵死」→ 每秒判路线失效重规划、在 4 m 和 11 m 绕行之间来回跳。防撞靠局部代价图（仍用真实 0.65×0.38）
      # obstacle_layer：人/临时障碍进全局图，规划器能提前绕开；堵死则规划失败→等待（2026-10-01）
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: "scan"
        scan:
          topic: "/scan"
          data_type: "LaserScan"
          expected_update_rate: 1.0
          min_obstacle_height: -0.10
          max_obstacle_height: 0.50
          # 只收近处：远处墙点受定位误差影响会把门洞「描窄」
          obstacle_max_range: 2.5
          raytrace_max_range: 3.5
          clearing: true
          marking: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 走廊宽 ~1.7 m（map_live003 中线到墙 0.8~0.9 m）。半径要盖到中线、衰减要缓，
        # 否则中间一段代价全 0，路径贴哪边都一样（2026-10-01：0.50/3.0 → 0.90/2.5）
        # 2026-10-02：2.5→4.0。2.5 时人旁 0.8 m 窄缝代价太高，规划器反复去找更宽的绕行、来回改路线；
        # 4.0 衰减更快，敢走最短路线，走廊居中倾向变弱（中线代价 ~50→~19）。不满意改回 2.5（可在线改）
        cost_scaling_factor: 4.0
        inflation_radius: 0.90

map_server:
  ros__parameters:
    # 注意：ros__parameters 下不能只有注释，否则 YAML 解析成 null，
    # nav2_bringup LoadComposableNodes 会直接 TypeError 退出（网页表现为导航闪一下就关）。
    use_sim_time: False
    yaml_filename: ""  # 由 bringup map:= 覆盖

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    use_sim_time: False

# bringup 会加载这两块；缺省时 lifecycle heal 也对不上
waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # 与 DWB 上限对齐；钢镚可横移
    max_velocity: [0.24, 0.14, 0.45]
    min_velocity: [0.0, -0.14, -0.45]   # vx 下限 0：兜底拦截任何倒车指令
    max_accel: [0.6, 0.5, 1.2]
    max_decel: [-0.6, -0.5, -1.2]
    odom_topic: "/odom_nav"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0